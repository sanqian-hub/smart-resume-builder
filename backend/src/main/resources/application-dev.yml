spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_resume?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "your-db-password"
  data:
    redis:
      host: localhost
      port: 6379

app:
  frontend-url: http://localhost:5173
  mail:
    from-name: SmartResume 智能简历

